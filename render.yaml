services:
  - type: web
    name: mtm-tekknights-agentic-planner
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: LLM_PROVIDER
        value: "openai"
      - key: LLM_MODEL
        value: "openai/gpt-oss-20b"
      - key: LLM_REASONING_EFFORT
        value: "low"
      - key: LLM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
